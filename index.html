<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF7F2;--card:#fff;--ink:#1F2A24;--muted:#56625B;--green:#2E7D5B;--green-d:#1F5E43;--green-i:#1F6B4A;--green-s:#E2F1E8;--peach:#FDEBDD;--peach-2:#F2A579;--peach-i:#8A3F14;--red:#B42318;--red-s:#FDE4E1;--orange:#9A4A00;--orange-s:#FFEBD3;--sand:#F3EEE6;--line:#E6DFD3;--line-2:#EFE9DF;--chip:#D6CEC1;--field:#8E978F;--warn-bg:#FFF6EC;--warn-b:#B8661A;--cam:#24302A;--snack:#1F2A24;--shadow:0 1px 2px rgba(31,42,36,.06),0 2px 8px rgba(31,42,36,.06);--float:0 6px 20px rgba(31,42,36,.14);
--c-green:#E2F1E8;--c-blue:#E8EEFB;--c-sand:#F6EEDC;--c-ice:#E3F1F6;--c-pink:#F4E8F2;--c-peach:#FDEBDD;--c-lilac:#ECE8FB;--c-grey:#F3EEE6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1C2420;--ink:#EDF2EE;--muted:#A3AFA8;--green:#2F8A63;--green-d:#8FD3B0;--green-i:#8FD3B0;--green-s:#1F3A2D;--peach:#3A281D;--peach-2:#E8996C;--peach-i:#F3C2A2;--red:#FF8B7B;--red-s:#3D1E1B;--orange:#FFB46A;--orange-s:#3B2A16;--sand:#252E2A;--line:#2E3934;--line-2:#28312D;--chip:#3B4842;--field:#6E7A73;--warn-bg:#2E2418;--warn-b:#D08A3E;--cam:#0B0F0D;--snack:#EDF2EE;--shadow:0 1px 2px rgba(0,0,0,.3);
--c-green:#1F3A2D;--c-blue:#1F2940;--c-sand:#352E1F;--c-ice:#1B3139;--c-pink:#3A2436;--c-peach:#3A281D;--c-lilac:#2B2742;--c-grey:#252E2A}}
:root[data-theme="dark"]{--bg:#121815;--card:#1C2420;--ink:#EDF2EE;--muted:#A3AFA8;--green:#2F8A63;--green-d:#8FD3B0;--green-i:#8FD3B0;--green-s:#1F3A2D;--peach:#3A281D;--peach-2:#E8996C;--peach-i:#F3C2A2;--red:#FF8B7B;--red-s:#3D1E1B;--orange:#FFB46A;--orange-s:#3B2A16;--sand:#252E2A;--line:#2E3934;--line-2:#28312D;--chip:#3B4842;--field:#6E7A73;--warn-bg:#2E2418;--warn-b:#D08A3E;--cam:#0B0F0D;--snack:#EDF2EE;--shadow:0 1px 2px rgba(0,0,0,.3);
--c-green:#1F3A2D;--c-blue:#1F2940;--c-sand:#352E1F;--c-ice:#1B3139;--c-pink:#3A2436;--c-peach:#3A281D;--c-lilac:#2B2742;--c-grey:#252E2A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--green-d)}
svg{flex-shrink:0}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:16px 16px 120px;display:flex;flex-direction:column;gap:16px}
.app.store{background:var(--card)}
.app.has-footer{padding-bottom:196px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.hdr .col{display:flex;flex-direction:column;min-width:0;flex:1}
h1{margin:0;font-size:28px;line-height:36px;font-weight:700}
h1.sm{font-size:20px;line-height:28px;font-weight:600}
h2{margin:0;font-size:20px;font-weight:600}
h3.grp{margin:0;font-size:14px;font-weight:600;color:var(--muted)}
.sub{font-size:14px;color:var(--muted)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--green-i);white-space:nowrap}
.sync.off{color:var(--orange)} .sync.err{color:var(--red)}
.back{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border:0;background:none;margin-right:-12px;border-radius:12px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.list{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 12px 8px 16px;border:0;border-bottom:1px solid var(--line-2);background:var(--card);width:100%;text-align:right;text-decoration:none;color:var(--ink)}
.row:last-child{border-bottom:0}
.row .t{display:flex;flex-direction:column;flex:1;min-width:0}
.row .t b{font-size:16px;font-weight:600}
.row .t span{font-size:14px;color:var(--muted)}
.ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink)}
.ico.lg{width:44px;height:44px}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;flex-shrink:0}
.tag.out{background:var(--red-s);color:var(--red)} .tag.warn{background:var(--orange-s);color:var(--orange)} .tag.ok{background:var(--green-s);color:var(--green-i)} .tag.auto{background:var(--sand);color:var(--muted);font-weight:500} .tag.man{background:var(--peach);color:var(--peach-i);font-weight:500}
.btn{height:48px;border-radius:12px;border:1.5px solid var(--green);background:var(--card);color:var(--green-d);font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;text-decoration:none}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.big{height:56px;width:100%}
.btn.ghost{border-color:var(--chip);color:var(--ink)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.link{border:0;background:none;text-decoration:underline}
.btn:disabled{opacity:.5;cursor:default}
.btn.w{width:100%}
.sq{width:48px;height:48px;border:0;border-radius:12px;background:var(--sand);display:flex;align-items:center;justify-content:center}
.seg{height:48px;background:var(--sand);border-radius:12px;padding:4px;display:grid;gap:4px;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.seg button{border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:16px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(31,42,36,.1)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:40px;padding:0 14px;border:1.5px solid var(--chip);border-radius:999px;background:var(--card);font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--green);background:var(--green-s);color:var(--green-d);font-weight:600}
.field{height:48px;border-radius:12px;background:var(--card);border:1.5px solid var(--field);display:flex;align-items:center;gap:8px;padding:0 12px}
.field input{flex:1;border:0;outline:0;background:transparent;font-size:16px;min-width:0;height:100%}
.field:focus-within{border-color:var(--green);box-shadow:0 0 0 3px var(--green-s)}
.fab{position:fixed;z-index:20;left:max(16px,calc(50% - 264px));bottom:calc(100px + env(safe-area-inset-bottom));height:56px;padding:0 20px 0 22px;border:0;border-radius:999px;background:var(--peach-2);color:#1F2A24;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:var(--float)}
.nav{position:fixed;z-index:30;bottom:0;left:0;right:0;height:calc(84px + env(safe-area-inset-bottom));padding-bottom:calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:560px;margin:0 auto}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--muted);position:relative;font-size:14px;font-weight:500}
.nav a .pill{width:56px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.nav a.on{color:var(--green-d);font-weight:700} .nav a.on .pill{background:var(--green-s)}
.nav .badge{position:absolute;top:6px;left:calc(50% - 34px);min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.footer{position:fixed;z-index:25;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;padding:12px 16px;background:var(--bg);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.app.store~#footer .footer{background:var(--card)}
.snack{position:fixed;z-index:60;left:16px;right:16px;max-width:528px;margin:0 auto;bottom:calc(100px + env(safe-area-inset-bottom));background:var(--snack);color:var(--bg);border-radius:12px;padding:4px 8px 4px 16px;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:var(--float);transform:translateY(20px);opacity:0;pointer-events:none;transition:.2s}
.snack.show{transform:none;opacity:1;pointer-events:auto}
.snack button{height:48px;padding:0 12px;border:0;background:transparent;color:#9FE0BE;font-size:16px;font-weight:700}
:root[data-theme="dark"] .snack button{color:var(--green)}
.scrim{position:fixed;inset:0;z-index:70;background:rgba(18,24,21,.45);display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.sheet{background:var(--card);border-radius:24px 24px 0 0;padding:12px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:var(--float)}
.sheet .grab{align-self:center;width:40px;height:4px;border-radius:4px;background:var(--chip);flex-shrink:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
.form label.full{grid-column:1/-1}
.form input,.form select,.form textarea{height:48px;border-radius:12px;border:1.5px solid var(--field);background:var(--card);padding:0 12px;font-size:16px;font-weight:400;color:var(--ink);width:100%}
.form textarea{height:auto;min-height:96px;padding:10px 12px}
.form input:focus,.form select:focus,.form textarea:focus{outline:0;border-color:var(--green);box-shadow:0 0 0 3px var(--green-s)}
.chk{display:flex!important;flex-direction:row!important;align-items:center;gap:8px;color:var(--ink)!important;font-weight:500!important}
.chk input{width:22px;height:22px;accent-color:var(--green)}
.switch{width:52px;height:32px;border-radius:999px;border:0;background:var(--field);position:relative;padding:0;flex-shrink:0}
.switch::after{content:"";position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.15s}
.switch[aria-checked="true"]{background:var(--green)} .switch[aria-checked="true"]::after{right:24px}
.box{width:28px;height:28px;border-radius:8px;border:2px solid #6B746E;background:var(--card);display:flex;align-items:center;justify-content:center}
.box.on{border:0;background:var(--green)}
.banner{border-radius:16px;padding:12px 16px;display:flex;gap:12px;align-items:center;font-size:14px}
.banner.peach{background:var(--peach);color:var(--peach-i)} .banner.green{background:var(--green-s);color:var(--green-i)} .banner.red{background:var(--red-s);color:var(--red)}
.banner .t{flex:1;display:flex;flex-direction:column;gap:2px}
.banner b{color:var(--ink);font-size:16px}
.empty{text-align:center;padding:32px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .big{width:72px;height:72px;border-radius:24px;display:flex;align-items:center;justify-content:center}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.metric{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.metric b{font-size:28px;font-weight:700} .metric span{font-size:14px;color:var(--muted)}
.qtyline{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qty{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.qty small{font-size:16px;font-weight:400;color:var(--muted)}
.progress{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .2s}
.cam{height:260px;border-radius:16px;background:var(--cam);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border:0;width:100%}
.cam .c{position:absolute;width:32px;height:32px;border:0 solid var(--peach-2)}
.cam img{max-width:100%;max-height:100%;opacity:.85}
.scanline{position:absolute;left:10%;right:10%;height:3px;background:var(--peach-2);box-shadow:0 0 12px var(--peach-2);animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{from{top:12%}to{top:86%}}
.paper{width:150px;height:200px;background:#F3EEE6;border-radius:4px;display:flex;flex-direction:column;gap:10px;padding:18px 16px;opacity:.9}
.paper i{height:6px;background:#CFC7B9;border-radius:4px;display:block}
.rline{border-radius:16px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line)}
.rline.unrec{flex-direction:column;align-items:stretch;background:var(--warn-bg);border:2px dashed var(--warn-b);padding:12px 16px}
.rline.irr{background:var(--sand);border-color:transparent;padding:8px 8px 8px 16px}
.dot{width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.counter{min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
.counter b{display:flex;align-items:center;gap:4px;font-size:20px}
.counter span{font-size:14px;font-weight:500}
table.coef{width:100%;border-collapse:collapse;font-size:14px}
table.coef th,table.coef td{padding:6px 4px;border-bottom:1px solid var(--line-2);text-align:center}
table.coef th:first-child,table.coef td:first-child{text-align:right}
table.coef input{width:52px;height:36px;border:1.5px solid var(--field);border-radius:8px;background:var(--card);text-align:center;font-size:14px}
.skel{background:linear-gradient(90deg,var(--sand),var(--line-2),var(--sand));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:16px;height:88px}
@keyframes sk{to{background-position:-200% 0}}
.hide{display:none!important}
.mono{font-variant-numeric:tabular-nums}
.row.store{min-height:72px}.row.store .t b{font-size:20px}
@media (min-width:900px){.app{max-width:760px}.nav,.footer{max-width:760px}.fab{left:calc(50% - 364px)}.snack{max-width:728px}}
/* צ'אט עם הסוכן */
.chatfab{position:fixed;z-index:20;right:max(16px,calc(50% - 264px));bottom:calc(100px + env(safe-area-inset-bottom));width:56px;height:56px;border:0;border-radius:999px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--float)}
.chatfab.up{bottom:calc(196px + env(safe-area-inset-bottom))}
.chatfab.test{bottom:calc(168px + env(safe-area-inset-bottom));background:var(--peach-2);color:#1F2A24;font-size:14px;font-weight:700}
.chatfab.test.up{bottom:calc(264px + env(safe-area-inset-bottom))}
.chat .av.test{background:var(--peach);color:var(--peach-i)}
.chat{position:fixed;inset:0;z-index:80;background:rgba(18,24,21,.45);display:flex;justify-content:center;align-items:flex-end}
.chat .win{background:var(--bg);width:100%;max-width:560px;height:min(88vh,720px);border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--float)}
.chat .top{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.chat .av{background:var(--green-s);color:var(--green-d);width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.chat .msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.chat .m{max-width:85%;padding:10px 14px;border-radius:16px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.chat .m.user{align-self:flex-start;background:var(--green);color:#fff;border-end-start-radius:4px}
.chat .m.model{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-end-end-radius:4px}
.chat .m.err{align-self:center;background:var(--red-s);color:var(--red);font-size:14px}
.chat .m .src{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:13px}
.chat .acts{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-end;max-width:85%}
.chat .acts button{height:36px;border-radius:999px;border:1.5px solid var(--green);background:var(--card);color:var(--green-d);font-size:14px;font-weight:600;padding:0 12px}
.chat .typing{align-self:flex-end;color:var(--muted);font-size:14px}
.chat form{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.chat form input{flex:1;min-width:0;height:48px;border-radius:12px;border:1.5px solid var(--field);background:var(--card);padding:0 12px}
.chat .sugg{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-end;justify-content:flex-end}
.chat .sugg button{height:36px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:14px}
@media (min-width:900px){.chatfab{right:calc(50% - 364px)}.chat .win{max-width:760px}}
</style>
</head>

function ageOf(m){const b=new Date(m.birth);if(isNaN(b))return 30;const n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return Math.max(0,a)}

function coefFor(g,cat){const cc=S.catCoef[cat];return cc&&cc[g]!=null?cc[g]:S.coef[g]}
function factor(cat,fam=members()){return fam.reduce((s,m)=>s+coefFor(groupOf(m).id,cat),0)}
function totalFactor(fam=members()){return items().reduce((s,c)=>s+c.weekly*factor(c.cat,fam),0)}
function actualWeekly(c){
 const since=Date.now()-56*DAY;
 const ev=S.log.filter(l=>l.item===c.id&&l.t>since&&l.delta<0&&['use','out'].includes(l.type));
 if(!ev.length)return null;
 const first=Math.min(...S.log.filter(l=>l.item===c.id).map(l=>l.t));
 const weeks=Math.max(1,(Date.now()-Math.max(first,since))/(7*DAY));
 return {rate:ev.reduce((s,l)=>s-l.delta,0)/weeks,weeks};
}
function expectedWeekly(c){
 const prof=c.weekly*factor(c.cat);
 const a=actualWeekly(c);if(!a||a.weeks<2)return prof;
 const w=Math.min(.7,a.weeks*.12);return prof*(1-w)+a.rate*w;
}

const ST={out:['נגמר','out',I.x],exp:['תוקף קרוב','warn',I.clock],low:['מתחת למינימום','warn',I.down]};
const tagHtml=s=>ST[s]?`<span class="tag ${ST[s][1]}">${svg(ST[s][2],16,2.25)}${ST[s][0]}</span>`:'';
const expText=c=>{const e=expDaysLeft(c);return e==null?'':e<0?'פג תוקף '+dm(c.expiry):e===0?'בתוקף עד היום':e===1?'בתוקף עד מחר, '+dm(c.expiry):'בתוקף עד '+dm(c.expiry)};

/* ================== רשימת קניות ================== */
function nextListDate(from=new Date()){const d=new Date(from);let n=(S.settings.listDay-d.getDay()+7)%7;if(n===0)n=7;return addDays(d,n)}
function weekStartFor(d=new Date()){const dd=new Date(d);const back=(dd.getDay()-S.settings.listDay+7)%7;return addDays(dd,-back)}
const packLabel=(c,p)=>c.pack===1?`${fmt(p)} ${c.unit}`:`${fmt(p)} × ${fmt(c.pack)} ${c.unit}`;
function liQty(li){const c=byId(li.item);return c?packLabel(c,li.packs):(li.qtyText||'1')}
function lastPrice(c){return c?.prices?.length?c.prices[c.prices.length-1].p:null}
function calcNeed(c){
 const days=Math.max(1,daysBetween(new Date(),nextListDate()))+S.settings.safetyDays;
 const exp=expectedWeekly(c),min=minOf(c);
 const need=exp*days/7+min-c.qty;
 const st=status(c);
 let reason=null;
 if(c.qty<=0)reason='נגמר';else if(c.qty<min)reason='מתחת למינימום';
 else if(need>0&&exp>0){const runOut=Math.floor(c.qty/(exp/7));reason='צפוי להיגמר עד יום '+DAYS[new Date(addDays(new Date(),Math.min(runOut,6))).getDay()]}
 if(st==='exp'&&!reason)reason='תוקף קרוב';
 if(!reason)return null;
 const packs=c.pack===1?Math.max(c.step,ceilStep(Math.max(need,0),c.step)):Math.max(1,Math.ceil(need/c.pack-1e-9));
 return {packs,reason};
}
function generateList(silent){
 const L=S.list;
 const keep=L.items.filter(i=>!i.del&&!i.done&&(i.src==='manual'||i.carry));
 if(L.items.length&&!silent){S.lists.push(touch({id:L.id,week:L.week,status:L.status,items:L.items.filter(i=>!i.del),versions:L.versions}))}
 const n={id:L.week===weekStartFor()&&silent?L.id:'L'+uid(),week:weekStartFor(),status:'draft',items:[],versions:[]};
 n.items=keep.map(i=>touch({...i}));
 items().forEach(c=>{const r=calcNeed(c);if(!r)return;if(n.items.find(i=>i.item===c.id)){n.items.find(i=>i.item===c.id).reason=r.reason;return}
  n.items.push(touch({id:uid(),item:c.id,name:c.name,cat:c.cat,packs:r.packs,src:'auto',reason:r.reason,done:false}))});
 S.list=touch(n);S.settings.lastGen=Date.now();
 if(!silent){S.log.push(touch({id:uid(),t:Date.now(),item:null,name:`רשימה שבועית חדשה · ${activeList().length} פריטים`,type:'list',by:'אוטומטי'}));
  if(S.settings.notif.ready)notice(`הרשימה השבועית מוכנה · ${activeList().length} פריטים`,'shop');
  if(REMOTE&&S.settings.notif.ready)gs('notify','רשימת הקניות השבועית מוכנה',`${activeList().length} פריטים ברשימה לשבוע ${dm(S.list.week)}`).catch(()=>{})}
}
const activeList=()=>S.list.items.filter(i=>!i.del&&!i.removed);
const openCount=()=>activeList().filter(i=>!i.done).length;
function ensureOnList(c,reason){
 let li=S.list.items.find(i=>i.item===c.id&&!i.del&&!i.done);
 if(li){if(li.removed){li.removed=false;touch(li)}return li}
 const r=calcNeed(c);
 li=touch({id:uid(),item:c.id,name:c.name,cat:c.cat,packs:r?r.packs:1,src:'auto',reason:reason||r?.reason||'מתחת למינימום',done:false});
 S.list.items.push(li);touch(S.list);return li;
}

function setQty(c,q,type='use',silent){
 q=Math.max(0,r1(q));const prev=c.qty;if(prev===q)return;
 c.qty=q;c.qu=Date.now();c.by=user()?.name||'';touch(c);
 if(q>prev&&c.shelf)c.expiry=addDays(today(),c.shelf);
 S.log.push(touch({id:uid(),t:Date.now(),item:c.id,name:c.name,type:q===0?'out':q>prev?(type==='buy'?'buy':'fix'):type,delta:r1(q-prev),prev,qty:q,by:c.by}));
 if(q<minOf(c))ensureOnList(c);

 save();
}

 const m0=new Date();m0.setDate(1);m0.setHours(0,0,0,0);

 const recs=S.receipts.filter(r=>r.status==='approved'&&!r.del&&new Date(r.date)>=m0);
 const buys=mon.filter(l=>l.type==='buy');

 const trips=mon.filter(l=>l.type==='buy'&&!l.item).length;
 const outs=mon.filter(l=>l.type==='out');
 const outBy={};S.log.filter(l=>l.type==='out'&&l.t>Date.now()-60*DAY).forEach(l=>outBy[l.name]=(outBy[l.name]||0)+1);
 const top=Object.entries(outBy).sort((a,b)=>b[1]-a[1]).slice(0,3);

 const evs=S.log.filter(l=>ui.histF==='all'||(ui.histF==='buy'?['buy','list'].includes(l.type):['use','out','fix'].includes(l.type))).slice().reverse().slice(0,60);

 return `${subHeader('היסטוריה ודוחות')}

/* ================== גיליונות (Bottom sheets) ================== */
let SH=null;

function renderSheet(){
 const el=$('#sheet');if(!SH){el.innerHTML='';return}
 const body=SHEETS[SH.type](SH);
 el.innerHTML=`<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true"><span class="grab"></span>${body}</div></div>`;
 const f=el.querySelector('[autofocus]');if(f&&!SH.noFocus){f.focus();SH.noFocus=true}
}
const opt=(v,l,cur)=>`<option value="${esc(v)}" ${String(v)===String(cur)?'selected':''}>${esc(l)}</option>`;
const sheetHead=(t,s)=>`<div style="display:flex;flex-direction:column"><span style="font-size:20px;font-weight:600">${t}</span>${s?`<span class="sub">${s}</span>`:''}</div>`;

 missing(sh){const q=normA(sh.q||'');const list=items().filter(c=>!q||normA(c.name).includes(q)).sort((a,b)=>({out:0,low:1,exp:2,ok:3}[status(a)]-{out:0,low:1,exp:2,ok:3}[status(b)])).slice(0,8);

  ${sh.q&&!list.some(c=>normA(c.name)===q)?`<button class="row" style="min-height:56px;color:var(--green-d);font-weight:600" data-a="missingFree">${svg(I.plus,20)}הוספת "${esc(sh.q)}" כפריט חופשי</button>`:''}</div>
  <label class="chk"><input type="checkbox" id="missOut" ${sh.out?'checked':''} data-ch="missOut"> לסמן גם במלאי כ"נגמר"</label>

 stock(sh){const c=byId(sh.id);return `${sheetHead(esc(c.name),`${catOf(c.cat).name} · מינימום ${fmt(minOf(c))} ${c.unit}`)}
  <form class="form" data-f="stock" data-id="${c.id}"><label>כמות מדויקת (${c.unit})<input name="qty" type="number" step="any" min="0" inputmode="decimal" value="${c.qty}" autofocus></label>

  <button class="btn link" data-a="close">ביטול</button>`},
 item(sh){const c=sh.id?byId(sh.id):{name:sh.name||'',cat:sh.cat||'other',unit:'יחידות',pack:1,weekly:1,loc:'מזווה',step:1,customMin:null,shelf:0,aliases:sh.alias?[sh.alias]:[],preferred:'',alts:'',qty:0,prices:[]};

 member(sh){const m=sh.id?S.family.find(x=>x.id===sh.id):{name:'',birth:'',role:'member',email:''};const ed=isAdmin();

  <label class="full">מייל Google (להתראות ושיתוף)<input name="email" type="email" value="${esc(m.email||'')}" ${ed?'':'disabled'} dir="ltr"></label>

  <button class="btn link" data-a="close">סגירה</button>`},
 li(sh){const i=S.list.items.find(x=>x.id===sh.id);const c=byId(i.item);
  return `${sheetHead(esc(i.name),`${i.src==='auto'?'הוצע אוטומטית':'נוסף ידנית'}${i.reason?' · '+esc(i.reason):''}${i.who?' · '+esc(i.who):''}`)}

 match(sh){const r=curReceipt();const l=r.lines.find(x=>x.id===sh.id);const q=normA(sh.q||'');

/* ================== חשבוניות: OCR, פענוח, התאמה ================== */
function suggest(raw,n=3){
 const r=norm(raw);if(!r)return [];
 return items().map(c=>{let s=dice(r,norm(c.name));c.aliases.forEach(a=>{s=Math.max(s,normA(a)===normA(raw)?1:dice(r,norm(a)))});const toks=norm(c.name).split(' ').filter(t=>t.length>1);if(toks.length&&toks.every(t=>r.includes(t)))s=Math.max(s,.8);return {c,s}}).sort((a,b)=>b.s-a.s).slice(0,n);
}
function addQtyFor(c,n){return c?r1(c.pack===1?n:n*c.pack):n}
function matchLines(lines){
 return lines.map((l,i)=>{const base={id:i+1,raw:l.raw,price:l.price,n:l.n};
  if(IRR.test(l.raw)||l.price<0)return {...base,type:'irr'};
  const best=suggest(l.raw,1)[0];
  if(best&&best.s>=.62)return {...base,type:'rec',item:best.c.id,add:addQtyFor(best.c,l.n)};
  return {...base,type:'unrec'};
 });
}
function parseReceipt(text){
 const rows=text.split(/\n+/).map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean);
 let store='',date=today(),total=0;const lines=[];
 for(const row of rows){
  const dmatch=row.match(/(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/);
  if(dmatch&&!lines.length&&date===today()){let y=+dmatch[3];if(y<100)y+=2000;const d=new Date(y,+dmatch[2]-1,+dmatch[1]);if(!isNaN(d)&&y>2000)date=iso(d);continue}
  if(/סה"?כ|לתשלום|total|סך הכל/i.test(row)){const m=row.match(/(\d{1,5}[.,]\d{2})/g);if(m)total=parseFloat(m[m.length-1].replace(',','.'));continue}
  const pm=row.match(/(-?\d{1,4}[.,]\d{2})\s*-?$/)||row.match(/^-?\s*(\d{1,4}[.,]\d{2})/);
  if(!pm){if(!store&&/[א-ת]{2,}/.test(row))store=row.slice(0,40);continue}
  const price=parseFloat(pm[1].replace(',','.'))*(/-/.test(row.replace(/\d-\d/g,''))&&/הנח/.test(row)?-1:1);
  let n=1;const qm=row.match(/(\d+(?:[.,]\d+)?)\s*[xX×*]\s*\d/)||row.match(/\d\s*[xX×*]\s*(\d+(?:[.,]\d+)?)/);if(qm)n=parseFloat(qm[1].replace(',','.'));
  const wm=row.match(/(\d+[.,]\d{3})\s*(ק"?ג|kg)?/);if(wm)n=parseFloat(wm[1].replace(',','.'));
  const name=row.replace(pm[0],'').replace(/\d+[.,]?\d*\s*[xX×*]/g,'').replace(/-?\d{1,4}[.,]\d{2,3}/g,'').replace(/[₪*]/g,'').replace(/\s+\d{6,}\s*/g,' ').trim();
  if(!/[א-תa-zA-Z]{2,}/.test(name))continue;
  if(!store&&!lines.length&&!price)continue;
  lines.push({raw:name.slice(0,48),price:Math.abs(price)*(price<0?-1:1),n:n>0&&n<100?n:1});
 }
 if(!total)total=r1(lines.reduce((s,l)=>s+l.price,0));
 return {store:store||'חנות',date,total,lines};
}
const loadScript=src=>new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('טעינת רכיב הזיהוי נכשלה. בדקו חיבור לאינטרנט.'));document.head.appendChild(s)});
async function fileToImage(file){
 if(file.type==='application/pdf'){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const page=await pdf.getPage(1);const vp=page.getViewport({scale:2.5});
  const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;return cv;
 }
 const url=URL.createObjectURL(file);const img=new Image();await new Promise((r,j)=>{img.onload=r;img.onerror=()=>j(new Error('הקובץ אינו תמונה תקינה'));img.src=url});
 const sc=Math.min(1,2000/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=img.width*sc;cv.height=img.height*sc;
 const x=cv.getContext('2d');x.filter='grayscale(1) contrast(1.4)';x.drawImage(img,0,0,cv.width,cv.height);return cv;
}
function thumb(cv){const sc=Math.min(1,900/cv.height);const t=document.createElement('canvas');t.width=cv.width*sc;t.height=cv.height*sc;t.getContext('2d').drawImage(cv,0,0,t.width,t.height);return t.toDataURL('image/jpeg',.6)}
let scanToken=0;
async function handleFile(file){
 if(!file)return;const tok=++scanToken;
 ui.scan={state:'busy',p:0,msg:'מכינים את התמונה…'};go('scan');render();
 try{
  const cv=await fileToImage(file);if(tok!==scanToken)return;
  const img=thumb(cv);ui.scan.img=img;ui.scan.msg='טוענים רכיב זיהוי עברית (בפעם הראשונה בלבד)…';render();
  await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  const res=await Tesseract.recognize(cv,'heb+eng',{logger:m=>{if(tok!==scanToken)return;if(m.status==='recognizing text'){ui.scan.p=m.progress;ui.scan.msg='מזהים שורות…';const b=document.querySelector('.progress i');if(b)b.style.width=Math.round(m.progress*100)+'%'}}});
  if(tok!==scanToken)return;
  const text=res.data.text||'';const conf=res.data.confidence||0;
  const p=parseReceipt(text);
  if(p.lines.length<2||conf<35){ui.scan={state:'err',msg:p.lines.length?'הצילום לא מספיק חד. נסו לצלם שוב באור טוב, כשהחשבונית ישרה וכולה בתמונה.':undefined};render();return}
  const r=touch({id:'r'+uid(),date:p.date,store:p.store,total:p.total,status:'pending',img,ocr:text,lines:matchLines(p.lines)});
  S.receipts.push(r);save();ui.scan=null;ui.rf='all';
  if(REMOTE)gs('saveReceiptImage',img,`${r.date} ${r.store}.jpg`).then(u=>{r.fileUrl=u;touch(r);save()}).catch(()=>{});
  go('review?'+r.id);
 }catch(e){if(tok!==scanToken)return;ui.scan={state:'err',msg:e.message};render()}
}
function approveReceipt(force){
 const r=curReceipt();if(!r)return;
 if(!force){const dup=S.receipts.find(x=>x.id!==r.id&&!x.del&&x.status==='approved'&&x.date===r.date&&normA(x.store)===normA(r.store)&&Math.abs((+x.total)-(+r.total))<.01);if(dup)return openSheet('dup')}
 const undo=snapshotUndo();let n=0,rm=0;
 r.lines.filter(l=>l.type==='rec').forEach(l=>{const c=byId(l.item);if(!c)return;
  setQty(c,c.qty+(+l.add||0),'buy',true);S.log[S.log.length-1].rid=r.id;n++;
  if(l.price>0)c.prices.push({d:r.date,p:r1(l.price/(+l.n||1)),store:r.store});
  const a=normA(l.raw);if(a&&a!==normA(c.name)&&!c.aliases.map(normA).includes(a))c.aliases.push(l.raw);
  touch(c);
  S.list.items.filter(i=>i.item===c.id&&!i.del&&!i.removed).forEach(i=>{if(c.qty>=minOf(c)){i.done=true;i.bought=true;touch(i);rm++}});
 });
 r.status='approved';r.nItems=n;r.approvedBy=user()?.name;touch(r);
 S.log.push(touch({id:uid(),t:Date.now(),item:null,name:`קנייה אושרה · ${n} פריטים עודכנו`,type:'buy',by:user()?.name,store:r.store}));
 ui.done=r.id;ui.doneInfo={n,rm,left:r.lines.filter(l=>l.type==='unrec').length};
 save();closeSheet();render();snack('המלאי עודכן',undo);
}

 // רשימה שבועית אוטומטית

 if(s.autoList){const ws=weekStartFor(now);const due=now.getDay()!==s.listDay||now.getHours()>=s.listHour;if(S.list.week&&S.list.week<ws&&due)generateList(false)}

async function askLocal(history,context,agent){
 // מצב מקומי (בלי Apps Script): קריאה ישירה מהדפדפן, עם מפתח ששמור במכשיר הזה בלבד.
 const ag=AGENTS[agent];
 const body={systemInstruction:{parts:[{text:ag.instruction+(ag.ctx?'\n\nענה בעברית, בקצרה. אלה נתוני הבית העדכניים:\n'+context:'')}]},contents:history.map(m=>({role:m.role,parts:[{text:m.text}]})),tools:[{google_search:{}}],generationConfig:{thinkingConfig:{thinkingLevel:'MINIMAL'}}};
 const FALLBACK='gemini-flash-lite-latest';let model=ag.model||FALLBACK;
 const call=()=>fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':localKey()},body:JSON.stringify(body)});
 let r=await call(),d=await r.json();
 if(r.status===400&&/thinking/i.test(JSON.stringify(d))){delete body.generationConfig;r=await call();d=await r.json()}
 if(r.status===429){delete body.tools;r=await call();d=await r.json()}
 // 503 = הדגם עמוס אצל Google. מנסים שוב אחרי המתנה קצרה, ואם עדיין עמוס עוברים לדגם הרגיל.
 for(const wait of [1500,3000]){if(r.status!==503&&r.status!==500)break;await new Promise(f=>setTimeout(f,wait));r=await call();d=await r.json()}
 if((r.status===503||r.status===500)&&model!==FALLBACK){model=FALLBACK;r=await call();d=await r.json()}
 if(!r.ok)throw new Error(d.error?.message||('שגיאה '+r.status));
 const c=d.candidates?.[0]||{};
 return {text:(c.content?.parts||[]).map(p=>p.text||'').join('').trim()||'לא התקבלה תשובה מהסוכן.',sources:(c.groundingMetadata?.groundingChunks||[]).filter(x=>x.web).slice(0,4).map(x=>({title:x.web.title,uri:x.web.uri}))};
}

function chatSuggestAdd(text){
 const open=activeList().filter(i=>!i.done);
 return items().filter(c=>c.name.length>1&&text.includes(c.name)&&status(c)!=='ok'&&!open.some(i=>i.item===c.id)).slice(0,4);
}
async function chatSend(q){
 q=String(q||'').trim();if(!q||CHAT.busy||!CHAT.open)return;
 const agent=CHAT.open,log=CHAT.log[agent],ctx=AGENTS[agent].ctx?agentContext():'';
 log.push({role:'user',text:q});CHAT.busy=true;chatStore();renderChat();
 const history=log.filter(m=>!m.err&&!m.local).slice(-20).map(m=>({role:m.role,text:m.text}));
 try{
  const r=REMOTE?await gs('askAgent',history,ctx,agent):await askLocal(history,ctx,agent);
  log.push({role:'model',text:r.text,sources:r.sources||[],add:AGENTS[agent].ctx?chatSuggestAdd(r.text).map(c=>c.id):[]});
 }catch(e){
  const msg=String(e.message||e);
  // מפתח לא תקין במצב מקומי: מוחקים אותו כדי שהצ'אט יבקש מפתח חדש.
  if(!REMOTE&&/API key/i.test(msg)){try{localStorage.removeItem('hg-gemini-key')}catch(err){}log.pop();CHAT.keyErr=true}
  else log.push({role:'model',err:true,text:'לא הצלחתי להגיע לסוכן: '+msg})}
 CHAT.busy=false;chatStore();renderChat();
}

 el.innerHTML=`<div class="chat" data-a="chatScrim"><div class="win" role="dialog" aria-modal="true" aria-label="${esc(ag.name)}">
  <div class="top"><span class="av${ag.cls}">${svg(I.chat,22)}</span>
   <span style="display:flex;flex-direction:column;flex:1"><b>${esc(ag.name)}</b><span class="sub">${esc(ag.sub)}</span></span>
   ${!REMOTE&&!needKey?`<button class="btn link" data-a="chatKeyReset">החלפת מפתח</button>`:''}${log.length?`<button class="btn link" data-a="chatClear">ניקוי</button>`:''}<button class="sq" data-a="chatClose" aria-label="סגירה">${svg(I.x,22)}</button></div>
  <div class="msgs" id="chatMsgs">${needKey?keyNote:msgs||welcome}${CHAT.busy?`<div class="typing">הסוכן כותב…</div>`:''}</div>
  ${needKey?`<form data-f="chatKey"><input name="key" type="password" placeholder="מפתח Gemini API" autocomplete="off" required><button class="btn pri">שמירה</button></form>`
   :`<form data-f="chat"><input id="chatIn" name="q" placeholder="כתבו שאלה…" autocomplete="off" ${CHAT.busy?'disabled':''}><button class="btn pri" ${CHAT.busy?'disabled':''}>שליחה</button></form>`}
 </div></div>`;
 const box=$('#chatMsgs');box.scrollTop=box.scrollHeight;
 const inp=el.querySelector('form input');if(inp&&!CHAT.busy)inp.focus();
}
document.addEventListener('submit',e=>{const k=e.target.dataset.f;if(k!=='chat'&&k!=='chatKey')return;e.preventDefault();e.stopImmediatePropagation();const v=new FormData(e.target);
 if(k==='chatKey'){const key=cleanKey(v.get('key'));try{if(key)localStorage.setItem('hg-gemini-key',key);else localStorage.removeItem('hg-gemini-key')}catch(err){}CHAT.keyErr=!key;renderChat()}else chatSend(v.get('q'))},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&CHAT.open){e.stopImmediatePropagation();A.chatClose()}},true);
if(!S||S.v!==2){S=seed();firstSeed()}
periodic();
ui.route=(location.hash.slice(1)||'home').split('?')[0];
render();
if(REMOTE){setSync('saving');gs('whoAmI').then(email=>{const m=members().find(x=>x.email&&x.email.toLowerCase()===String(email).toLowerCase());if(m&&!localStorage.getItem('hg-me')){me=m.id;render()}}).catch(()=>{});pullRemote(true);setInterval(()=>pullRemote(false),20000)}
setInterval(()=>{periodic();if(!SH&&!document.activeElement?.matches('input,textarea,select'))render()},6e4);
</script>
</body>
</html>
